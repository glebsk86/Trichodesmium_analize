[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trichodesmium-morphometry"
version = "0.8.0"
description = "Reviewable experimental bright-field filament morphometry"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "opencv-python-headless>=4.8,<5", "scikit-image>=0.22,<1", "Pillow>=11.1,<13", "pillow-heif>=1,<2", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
trichodesmium = "trichodesmium.local_app:main"
trichodesmium-seeds = "trichodesmium.cli:main"
trichodesmium-local = "trichodesmium.local_app:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trichodesmium = ["profiles/*.json", "profiles/*.xml.gz", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
